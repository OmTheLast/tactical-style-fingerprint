services:
  - type: web
    name: tactical-style-fingerprint-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_MODEL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: EXPLAIN_RATE_LIMIT_REQUESTS
        value: 5
      - key: EXPLAIN_RATE_LIMIT_WINDOW_SECONDS
        value: 600
